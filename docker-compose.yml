version: '3.8'

services:
  antiscam-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antiscam_uzbekistan
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - antiscam_data:/app/data

volumes:
  antiscam_data:
