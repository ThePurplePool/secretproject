version: '3.8'

networks:
  anti-scam-network:
    name: anti-scam-network
    driver: bridge

volumes:
  postgres_data:
  auth_data:
  user_data:
  scenario_data:
  simulation_data:
  progress_data:
  consultant_data:
  certificate_data:
  fraud_data:
  intelligence_data:
  voice_data:
  media_data:

services:
  # ─── DATABASE LAYER (PostgreSQL) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: antiscam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antiscam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antiscam_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - anti-scam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiscam"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── API GATEWAY (Single Public Entry Point) ──────────────
  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
    container_name: antiscam-api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3002
      SCENARIO_SERVICE_URL: http://scenario-service:3003
      SIMULATION_SERVICE_URL: http://simulation-service:3004
      PROGRESS_SERVICE_URL: http://progress-service:3005
      CONSULTANT_SERVICE_URL: http://consultant-service:3006
      CERTIFICATE_SERVICE_URL: http://certificate-service:3007
      FRAUD_REPORTING_SERVICE_URL: http://fraud-reporting-service:3008
      FRAUD_INTEL_SERVICE_URL: http://fraud-intelligence-service:3009
      VOICE_SERVICE_URL: http://voice-service:3010
      NOTIFICATION_SERVICE_URL: http://notification-service:3011
      MEDIA_SERVICE_URL: http://media-service:3012
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-anti-scam-internal-secret-2026}
    depends_on:
      - auth-service
      - user-service
      - scenario-service
      - simulation-service
      - progress-service
    networks:
      - anti-scam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── INTERNAL MICROSERVICES (No Host Ports Exposed) ─────────
  auth-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
    container_name: antiscam-auth-service
    restart: unless-stopped
    command: ["node", "-r", "ts-node/register", "services/auth-service/src/index.ts"]
    environment:
      PORT: 3001
      NODE_ENV: production
      USER_SERVICE_URL: http://user-service:3002
      PROGRESS_SERVICE_URL: http://progress-service:3005
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-anti-scam-internal-secret-2026}
    volumes:
      - auth_data:/app/data/auth
    networks:
      - anti-scam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  user-service:
    build:
      context: .
      dockerfile: infrastructure/docker/service.Dockerfile
    container_name: antiscam-user-service
    restart: unless-stopped
    command: ["node", "-r", "ts-node/register", "services/user-service/src/index.ts"]
    environment:
      PORT: 3002
      NODE_ENV: production
      PROGRESS_SERVICE_URL: http://progress-service:3005
      CERTIFICATE_SERVICE_URL: http://certificate-service:3007
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-anti-scam-internal-secret-2026}
    volumes:
      - user_data:/app/data/user
    networks:
      - anti-scam-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  scenario-service:
