version: '3.8'

# Development Docker Compose override with live-reload volume mounts
services:
  api-gateway:
    volumes:
      - ./services/api-gateway/src:/app/services/api-gateway/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development

  auth-service:
    volumes:
      - ./services/auth-service/src:/app/services/auth-service/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development

  user-service:
    volumes:
      - ./services/user-service/src:/app/services/user-service/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development

  scenario-service:
    volumes:
      - ./services/scenario-service/src:/app/services/scenario-service/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development

  simulation-service:
    volumes:
      - ./services/simulation-service/src:/app/services/simulation-service/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development

  progress-service:
